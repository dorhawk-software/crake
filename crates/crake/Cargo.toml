[package]
name = "crake"
description = "Crake in the user session: tray icon, panel, notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crake-proto = { path = "../crake-proto" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
# Same GPUI snapshot as tern: everything comes through gpui_kit's re-exports.
gpui-kit = "0.7"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
futures-util = { version = "0.3", default-features = false }
async-channel = "2"
jiff = "0.2"
resvg = "0.45"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon (StatusNotifierItem; GNOME shows it with the AppIndicator extension).
ksni = { version = "0.3", features = ["blocking"] }
# Certificate passwords and certificates, in the GNOME keyring (Secret Service).
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# The real monitors (GPUI's X11 backend reports one screen spanning them all).
x11rb = { version = "0.13", features = ["randr"] }

# The notification area's (Windows) or menu bar's (macOS) icon and its menu.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21"

# The login Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
# Credential Manager, the monitors, the taskbar's theme.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Services", "Win32_Graphics_Dwm"] }
# The windows' HWND, for DWM (sys::plain_frame).
raw-window-handle = "0.6"
# The single-instance pipe is read a line at a time.
tokio = { version = "1", features = ["io-util"] }

[build-dependencies]
# crake.exe's icon on Windows (a no-op elsewhere).
embed-resource = "3"

[dev-dependencies]
# The integration test (src/wire_tests.rs): craked itself, serving its API.
craked = { path = "../craked" }
tempfile = "3"
# Headless windows and simulated clicks for the window tests.
gpui-kit = { version = "0.7", features = ["test-support"] }
