[package]
name = "crake-os"
description = "Every unsafe call Crake makes, behind safe functions (CLAUDE.md, Not now: the unsafe layer)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nfq-updated = "0.2.6"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Its CoreFoundation, so values are of the very types craked's are.
system-configuration = "0.8"
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"], optional = true }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"], optional = true }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGError"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_System_Services"] }

[features]
# The app's own calls (macOS: its service and login item, the displays).
app = [
    "dep:objc2", "dep:objc2-foundation", "dep:objc2-service-management", "dep:objc2-core-graphics",
    "windows-sys/Win32_Graphics_Gdi", "windows-sys/Win32_Graphics_Dwm", "windows-sys/Win32_UI_HiDpi",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
