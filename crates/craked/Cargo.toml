[package]
name = "craked"
description = "Crake system daemon: runs openconnect, owns state and the log"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "craked"

[[bin]]
name = "craked"
path = "src/main.rs"

[[bin]]
name = "crake-hook"
path = "src/bin/crake-hook.rs"

[dependencies]
crake-proto = { path = "../crake-proto" }
crake-os = { path = "../crake-os" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
base64 = "0.23"
sha2 = "0.11"

# Linux only: answers held in NFQUEUE until their addresses are routed.
[target.'cfg(target_os = "linux")'.dependencies]
nfq-updated = "0.2.6"
# IPsec: craked's charon, driven over vici (`ipsec`).
rsvici = "0.1.5"
futures-util = { version = "0.3", default-features = false }

# Windows: the service, openconnect's console, the console session.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry"] }

# macOS: the system's DNS settings (the dynamic store), for every name.
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8"

[dev-dependencies]
tempfile = "3"
