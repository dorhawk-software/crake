<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crake tray menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 760px; height: 420px; position: relative; overflow: hidden; background: {{c.desk}}; color: {{c.ink}}; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<div style="height: 30px; background: {{c.bar}}; color: {{c.barInk}}; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px; font-size: 13px">
<span style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600">Fri 9 Oct  13:24</span>
<span style="width: 34px; height: 24px; border-radius: 12px; background: {{c.barActive}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><mask id="m-n3" maskUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40"><rect x="-8" y="-8" width="40" height="40" fill="#fff"/><rect x="10" y="4" width="2" height="2.00" fill="currentColor"/><path d="M5.25 15.00L6.75 15.00L11.25 24.00L9.75 24.00Z" fill="currentColor"/></mask><mask id="c-n3" maskUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40"><rect x="-8" y="-8" width="40" height="40" fill="#fff"/></mask></defs><g stroke="none" mask="url(#m-n3)" fill="currentColor" opacity="1.00"><path d="M4.82 15.30L3.09 12.73C1.16 7.45 2.73 4.08 6.61 2.67L9.78 1.52C11.19 1.00 12.77 1.63 13.52 3.03L19.35 2.58L15.00 4.89L15.25 5.59L19.81 4.73L15.32 7.96L14.81 9.42L14.94 12.41L14.62 16.88C14.62 19.88 19.50 21.38 21.75 24.00L1.50 24.00L3.38 16.50Z"/></g></svg></span>
<span style="width: 30px; height: 24px; display: flex; align-items: center; justify-content: center; opacity: 0.85"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 9a13 13 0 0 1 18 0"></path><path d="M6.5 12.5a8 8 0 0 1 11 0"></path><path d="M10 16a3 3 0 0 1 4 0"></path></svg></span>
<span style="width: 30px; height: 24px; display: flex; align-items: center; justify-content: center; opacity: 0.85"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></span>
<span style="width: 30px; height: 24px; display: flex; align-items: center; justify-content: center; opacity: 0.85"><svg width="18" height="16" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M23.5 10.5v3"></path></svg></span>
</div>

<div role="menu" aria-label="Crake" style="position: absolute; top: 36px; right: 70px; width: 340px; box-sizing: border-box; padding: 6px; background: {{c.menu}}; border: 1px solid {{c.line}}; border-radius: 12px; box-shadow: 0 16px 36px -16px rgba(0,0,0,0.4)">
<div role="menuitem" aria-disabled="true" style="padding: 7px 12px; color: {{c.muted}}">{{summary}}</div>
<sc-for list="{{tunnels}}" as="t" hint-placeholder-count="4">
<div role="menuitemcheckbox" aria-checked="{{t.aria}}" style="display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 6px">
<span style="width: 16px; display: flex"><sc-if value="{{t.on}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.5l3.2 3.2L14 6" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg></sc-if></span>{{t.name}}
</div>
</sc-for>
<div style="height: 1px; margin: 6px 12px; background: {{c.line}}"></div>
<div role="menuitem" style="padding: 7px 12px 7px 38px">Open Crake</div>
<div role="menuitem" style="padding: 7px 12px 7px 38px">New tunnel…</div>
<div role="menuitem" style="padding: 7px 12px 7px 38px">Settings…</div>
<div role="menuitem" style="padding: 7px 12px 7px 38px">Quit</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":760,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    // The menu is the desktop's own (AppIndicator on GNOME): drawn neutral, not in Crake's tokens beyond ink and line.
    const c = dark ? {
      desk: '#121314', bar: '#000000', barInk: '#EDEDED', barActive: '#3A3A3A',
      menu: '#2A2A2A', line: '#3A3A3A', ink: '#ECEDEE', muted: '#A9AEB4'
    } : {
      desk: '#DCDCD8', bar: '#1A1A1A', barInk: '#EDEDED', barActive: '#3C3C3C',
      menu: '#FAFAFA', line: '#E2E2DE', ink: '#1A1C1E', muted: '#5A5F64'
    };
    // The tooltip's line too; "· nothing routed today" without a route today, "Listening · 4 tunnels" past three.
    const summary = 'Listening · ACME, Nordbank · last route 13:21';
    const tunnels = [['ACME', true], ['Nordbank', true], ['Globex', false], ['Home lab', false]]
      .map(([name, on]) => ({ name, on, aria: on ? 'true' : 'false' }));
    return { c, summary, tunnels };
  }
}
</script>
</body>
</html>
