<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal: the bird looking around</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root { --desk: #121314; --panel: #1E2022; --line: #33363A; --ink: #ECEDEE; --muted: #A9AEB4; --accent: #2DD4BF; --accentInk: #0B1514; }
  body.light { --desk: #DCDCD8; --panel: #FFFFFF; --line: #E2E2DE; --ink: #1A1C1E; --muted: #5A5F64; --accent: #0F766E; --accentInk: #FFFFFF; }
  body { margin: 0; background: var(--desk); color: var(--ink); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
  .page { padding: 28px 40px 48px; }
  .intro { color: var(--muted); font-size: 13px; max-width: 860px; }
  .intro b { color: var(--ink); }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 18px; align-items: flex-start; }
  .cap { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; max-width: 420px; }
  .panel { width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .first { padding: 34px 32px 30px; text-align: center; }
  .first h3 { margin: 14px 0 6px; font-size: 18px; }
  .first p { margin: 0 auto 18px; color: var(--muted); max-width: 300px; }
  .btn { height: 40px; max-width: 220px; margin: 0 auto; border-radius: 6px; background: var(--accent); color: var(--accentInk);
    font-weight: 600; display: flex; align-items: center; justify-content: center; }
  svg.bird { color: var(--ink); overflow: visible; }
  /* The bird (body, beak, eye) moves; the grass stays. Its feet stand at 12.25, 20.5. */
  .who { transform-box: view-box; transform-origin: 12.25px 20.5px; }
  .play .a .who { animation: look 2.4s cubic-bezier(.4,0,.2,1) 1 both; }
  @keyframes look {
    0%, 12% { transform: none; }
    18%, 36% { transform: scaleX(-1); }            /* to the left */
    42%, 60% { transform: none; }                 /* to the right */
    68%, 88% { transform: rotate(-11deg); }        /* head cocked: nothing there */
    100% { transform: none; }
  }
  .play .b .who { animation: peek 2.8s cubic-bezier(.4,0,.2,1) 1 both; }
  @keyframes peek {
    0% { transform: translateY(2px); }
    14%, 26% { transform: translateY(-1.6px); }   /* up out of the grass */
    32%, 46% { transform: translateY(-1.6px) scaleX(-1); }
    52%, 66% { transform: translateY(-1.6px); }
    80%, 100% { transform: translateY(0); }        /* nothing: back down */
  }
  button.replay { margin-top: 14px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    color: var(--ink); font: 600 13px inherit; font-family: inherit; cursor: pointer; }
  label.t { display: inline-flex; gap: 8px; align-items: center; margin-left: 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body class="play">
<div class="page">
  <div class="intro"><b>The first-run bird, looking for a tunnel.</b> Played once as the panel opens, then the
    bird stands still (DESIGN.md: motion is kept for things that happen; a loop beside the sentence
    you&rsquo;re reading would pull at the eye). Still with reduce motion on.</div>
  <div class="grid" id="grid"></div>
  <button class="replay" id="replay" type="button">Play again</button>
  <label class="t"><input type="checkbox" id="light"> Light</label>
</div>
<script>
const bird = `<svg class="bird" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.5 20.5 5.3 15M6.2 20.5l.6-3.4M17.4 20.5l-.6-3.6M20.5 20.5l-1.7-5.2"/>
  <g class="who"><defs><mask id="m-n41" maskUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40"><rect x="-8" y="-8" width="40" height="40" fill="#fff"/><rect x="10" y="4" width="2" height="2.00" fill="currentColor"/><path d="M5.25 15.00L6.75 15.00L11.25 24.00L9.75 24.00Z" fill="currentColor"/></mask><mask id="c-n41" maskUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40"><rect x="-8" y="-8" width="40" height="40" fill="#fff"/></mask></defs><g stroke="none" mask="url(#m-n41)" fill="currentColor" opacity="1.00"><path d="M4.82 15.30L3.09 12.73C1.16 7.45 2.73 4.08 6.61 2.67L9.78 1.52C11.19 1.00 12.77 1.63 13.52 3.03L19.35 2.58L15.00 4.89L15.25 5.59L19.81 4.73L15.32 7.96L14.81 9.42L14.94 12.41L14.62 16.88C14.62 19.88 19.50 21.38 21.75 24.00L1.50 24.00L3.38 16.50Z"/></g><circle cx="12.4" cy="10.6" r=".9" fill="currentColor" stroke="none"/></g></svg>`;
const card = (cls, cap, sub) => `<div class="${cls}"><div class="cap">${cap}</div><div class="sub">${sub}</div>
  <div class="panel"><div class="first">${bird}<h3>No tunnels yet</h3>
  <p>Add the VPN your company gave you. Crake connects to it and sends through only what needs it.</p>
  <div class="btn">Add a tunnel&hellip;</div></div></div></div>`;
document.getElementById('grid').innerHTML =
  card('a', 'A. Looks around', 'Turns to look left, then right, then cocks its head: nothing there. About 2½ s.') +
  card('b', 'B. Peeks out', 'Rises out of the grass, looks left and right, finds nothing, settles back. About 3 s.');
document.getElementById('replay').onclick = () => {
  document.body.classList.remove('play'); void document.body.offsetWidth; document.body.classList.add('play');
};
document.getElementById('light').onchange = e => document.body.classList.toggle('light', e.target.checked);
</script>
</body>
</html>
