<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="software.dorhawk.Crake1"/>
  </policy>
  <!-- Anyone may call; craked asks polkit before it switches a tunnel. -->
  <policy context="default">
    <allow send_destination="software.dorhawk.Crake1"/>
  </policy>
</busconfig>
