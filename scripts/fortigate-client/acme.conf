# The FortiGate's dial-up gateway (scripts/fortigate-vm.sh): IKEv2, the
# gateway proving itself with a pre-shared key and the user signing in with
# a password (EAP-MSCHAPv2, as FortiClient does; the test's alice, nothing
# real), an address and DNS handed over by the gateway (mode-cfg), ACME's
# network through the tunnel.
connections {
  acme {
    version = 2
    remote_addrs = 192.0.2.1
    vips = 0.0.0.0
    proposals = aes256-sha256-ecp256
    local {
      auth = eap-mschapv2
      eap_id = alice
    }
    remote {
      auth = psk
    }
    children {
      acme {
        remote_ts = 10.40.0.0/16
        esp_proposals = aes256-sha256-ecp256
      }
    }
  }
}
secrets {
  ike-acme {
    secret = hunter2hunter2
  }
  eap-alice {
    id = alice
    secret = hunter2
  }
}
