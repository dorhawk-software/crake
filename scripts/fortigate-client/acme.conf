# The FortiGate's dial-up gateway (scripts/fortigate-vm.sh): IKEv2, a
# pre-shared key for now (the test's, nothing real), an address handed
# over by the gateway (mode-cfg), ACME's network through the tunnel.
connections {
  acme {
    version = 2
    remote_addrs = 192.0.2.1
    vips = 0.0.0.0
    proposals = aes256-sha256-ecp256
    local {
      auth = psk
      id = crake-client
    }
    remote {
      auth = psk
    }
    children {
      acme {
        remote_ts = 10.40.0.0/16
        esp_proposals = aes256-sha256-ecp256
      }
    }
  }
}
secrets {
  ike-acme {
    secret = hunter2hunter2
  }
}
