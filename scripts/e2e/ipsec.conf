# ACME's IPsec (IKEv2) gateway for scripts/e2e-test.sh, beside ocserv and
# openvpn, played by strongSwan as a FortiGate plays it (CLAUDE.md, 7j,
# 7k): the gateway proves itself with a pre-shared key, the user signs in
# with a password (EAP-MSCHAPv2, alice), and gets an address, the DNS
# server and ACME's domain and network (mode-cfg). Its tunnel ends on an
# XFRM interface (if_id 7, `ipsec0`, made by start.sh), so what comes out
# of it isn't the wire's and reaches ACME's network.
connections {
  acme {
    version = 2
    local_addrs = 198.51.100.10
    pools = acme
    proposals = aes256-sha256-ecp256, aes256gcm16-prfsha256-ecp256
    if_id_in = 7
    if_id_out = 7
    local {
      auth = psk
      id = vpn.acme.example
    }
    remote {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      acme {
        # ACME's network, and the host Globex reaches too (companies.sh).
        local_ts = 10.40.0.0/16,10.42.0.0/16
        esp_proposals = aes256-sha256-ecp256, aes256-sha256
        if_id_in = 7
        if_id_out = 7
      }
    }
  }
  # The same gateway proving itself with its certificate (signed by ACME's
  # own authority, the Dockerfile) instead of the key, on an address of its
  # own (start.sh): a client that names no gateway reaches this one.
  acme-cert {
    version = 2
    local_addrs = 198.51.100.11
    pools = acme
    proposals = aes256-sha256-ecp256, aes256gcm16-prfsha256-ecp256
    if_id_in = 7
    if_id_out = 7
    local {
      auth = pubkey
      certs = vpn-cert.pem
      id = vpn-cert.acme.example
    }
    remote {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      acme {
        local_ts = 10.40.0.0/16,10.42.0.0/16
        esp_proposals = aes256-sha256-ecp256, aes256-sha256
        if_id_in = 7
        if_id_out = 7
      }
    }
  }
}
pools {
  acme {
    addrs = 10.40.9.10-10.40.9.100
    dns = 10.40.0.2
    # INTERNAL_IP4_SUBNET and INTERNAL_DNS_DOMAIN (RFC 8598): hints.
    subnet = 10.40.0.0/16
    25 = acme.internal
  }
}
secrets {
  ike-acme {
    secret = hunter2hunter2
  }
  eap-alice {
    id = alice
    secret = hunter2
  }
}
