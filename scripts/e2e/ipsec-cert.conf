# ACME's IPsec gateway proving itself with its certificate instead of the
# key (design/proposals/ipsec-certificates.html), for scripts/e2e-test.sh
# only: signed by an authority of ACME's own (the Dockerfile makes both),
# on an address of its own (start.sh), so a client that names no gateway
# reaches this one. Apart from ipsec.conf, which the package, VM and NixOS
# tests' gateways load without these certificates.
connections {
  # The same gateway proving itself with its certificate (signed by ACME's
  # own authority, the Dockerfile) instead of the key, on an address of its
  # own (start.sh): a client that names no gateway reaches this one.
  acme-cert {
    version = 2
    local_addrs = 198.51.100.11
    pools = acme
    proposals = aes256-sha256-ecp256, aes256gcm16-prfsha256-ecp256
    if_id_in = 7
    if_id_out = 7
    local {
      auth = pubkey
      certs = vpn-cert.pem
      id = vpn-cert.acme.example
    }
    remote {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      acme {
        local_ts = 10.40.0.0/16,10.42.0.0/16,192.0.2.40/32
        esp_proposals = aes256-sha256-ecp256, aes256-sha256
        if_id_in = 7
        if_id_out = 7
      }
    }
  }
  # The user signs in with her certificate (alice's, signed by ACME's
  # authority) instead of a password (design/proposals/ipsec-certificates.html,
  # 2), picked by the name vpn-certs.acme.example.
  acme-certs {
    version = 2
    local_addrs = 198.51.100.11
    pools = acme
    proposals = aes256-sha256-ecp256, aes256gcm16-prfsha256-ecp256
    if_id_in = 7
    if_id_out = 7
    local {
      auth = pubkey
      certs = vpn-cert.pem
      id = vpn-certs.acme.example
    }
    remote {
      auth = pubkey
    }
    children {
      acme {
        local_ts = 10.40.0.0/16,10.42.0.0/16,192.0.2.40/32
        esp_proposals = aes256-sha256-ecp256, aes256-sha256
        if_id_in = 7
        if_id_out = 7
      }
    }
  }
  # Her certificate, then her password (two rounds, RFC 4739), picked by
  # the name vpn-certpw.acme.example.
  acme-certpw {
    version = 2
    local_addrs = 198.51.100.11
    pools = acme
    proposals = aes256-sha256-ecp256, aes256gcm16-prfsha256-ecp256
    if_id_in = 7
    if_id_out = 7
    local {
      auth = pubkey
      certs = vpn-cert.pem
      id = vpn-certpw.acme.example
    }
    remote-1 {
      auth = pubkey
    }
    remote-2 {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      acme {
        local_ts = 10.40.0.0/16,10.42.0.0/16,192.0.2.40/32
        esp_proposals = aes256-sha256-ecp256, aes256-sha256
        if_id_in = 7
        if_id_out = 7
      }
    }
  }
}
