auth = "plain[passwd=/etc/ocserv/passwd]"
tcp-port = 443
udp-port = 443
run-as-user = nobody
run-as-group = nogroup
socket-file = /run/ocserv.socket
server-cert = /etc/ocserv/cert.pem
server-key = /etc/ocserv/key.pem
isolate-workers = false
max-clients = 4
max-same-clients = 4
keepalive = 30
dpd = 10
mobile-dpd = 10
try-mtu-discovery = false
cisco-client-compat = true
device = vpns
predictable-ips = true
ipv4-network = 10.40.255.0/24
dns = 10.40.0.2
default-domain = acme.internal
route = 10.40.0.0/16
ping-leases = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE"
