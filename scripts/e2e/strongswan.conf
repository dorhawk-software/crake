# The e2e gateway's charon (scripts/e2e/start.sh): no routes of its own
# (start.sh routes the pool into ipsec0), its log in the shared folder.
charon {
  install_routes = no
  install_virtual_ip = no
  filelog {
    ipsec {
      path = /link/ipsec-server.log
      default = 1
      ike = 2
      cfg = 2
    }
  }
}
