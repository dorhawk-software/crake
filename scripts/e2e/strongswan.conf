# The e2e gateway's charon (scripts/e2e/start.sh): no routes of its own
# (start.sh routes the pool into ipsec0), its log in the shared folder.
charon {
  # The tests sign in from one address many times, and a look at an
  # untrusted certificate (ipsec-certificates.html, 5) ends at the
  # certificate, leaving a half-open IKE_SA here each time: past
  # strongSwan's defaults (5 per address, cookies from 10), the next test's
  # sign-in waited for them to time out (30 s).
  block_threshold = 100
  cookie_threshold = 100
  install_routes = no
  install_virtual_ip = no
  filelog {
    ipsec {
      path = /link/ipsec-server.log
      default = 1
      ike = 2
      cfg = 2
    }
  }
}
