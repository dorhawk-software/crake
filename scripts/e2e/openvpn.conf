# ACME's OpenVPN gateway for scripts/e2e-test.sh, beside ocserv: the same
# internal network behind it, a browser sign-in like the user's real one
# (sso.py answers the management interface), a token after that.
mode server
tls-server
dev ovpns
dev-type tun
topology subnet
proto udp
local 198.51.100.10
port 1194
ifconfig 10.40.254.1 255.255.255.0
ifconfig-pool 10.40.254.10 10.40.254.100
push "topology subnet"
push "route-gateway 10.40.254.1"
push "route 10.40.0.0 255.255.0.0"
push "dhcp-option DNS 10.40.0.2"
push "dhcp-option DOMAIN acme.internal"
# What Crake must leave alone: a default route and Windows' DNS lockdown.
push "redirect-gateway def1"
push "block-outside-dns"
ca /etc/openvpn/e2e/ca.crt
cert /etc/openvpn/e2e/server.crt
key /etc/openvpn/e2e/server.key
dh none
verify-client-cert none
username-as-common-name
duplicate-cn
management /run/openvpn-mgmt.sock unix
management-client-auth
auth-gen-token 3600
keepalive 10 60
disable-dco
verb 3
