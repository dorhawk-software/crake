# What the e2e image adds to ocserv.conf (the package and Windows VM tests
# use ocserv.conf alone), with its default-domain taken out: that would
# reach Globex's user too.
# A certificate from ACME's users' CA signs in too (carol's, in the image),
# its common name the user; anyone else signs in with a password.
enable-auth = "certificate"
ca-cert = /etc/ocserv/users-ca.pem
cert-user-oid = 2.5.4.3
# IPv6 inside the tunnel too (it rides in the tunnel's TLS, so through
# Cloudflare as well): an address for each client, ACME's IPv6 network.
ipv6-network = fd40:ff::/64
ipv6-subnet-prefix = 128
route = fd40:1::/64
# Each user's company: Globex's bob his own (companies.sh), everyone else
# ACME's, with ACME's domain.
config-per-user = /etc/ocserv/users/
default-user-config = /etc/ocserv/users/default
