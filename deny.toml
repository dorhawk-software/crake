# cargo-deny: what Crake's dependencies may be. Run by scripts/lint.sh;
# any finding fails it.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained or yanked crates (RustSec database).
version = 2
yanked = "deny"
# Known vulnerabilities fail the check wherever they are. "Unmaintained"
# fails it only for crates Crake depends on directly: several of GPUI's own
# dependencies are unmaintained with no replacement until GPUI moves on.
unmaintained = "workspace"
ignore = []

[licenses]
# Crake is GPL-3.0-or-later; these licences can be combined with it.
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # libbzip2's own BSD-style licence (via GPUI's HTTP client).
    "bzip2-1.0.6",
]

[bans]
# GPUI brings several versions of some crates; that's not a problem to fix here.
multiple-versions = "allow"
wildcards = "deny"
# Crake's own crates refer to each other by path.
allow-wildcard-paths = true

[sources]
# crates.io only: no unknown registries or git repositories.
unknown-registry = "deny"
unknown-git = "deny"
