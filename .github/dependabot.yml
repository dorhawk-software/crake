# Dependencies kept current: Rust crates and the workflows' actions, each
# weekly as one grouped pull request (one CI run, not one per crate). GPUI
# (gpui-kit, gpui-pre-*, gpui-fast-*) is left to .github/workflows/gpui.yml,
# which re-applies Crake's patch: a bump here would quietly drop it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates together; a major version (an API that
    # changed) gets a pull request of its own, so it can't hold the rest
    # back (2026-10-26: zbus 6 failed the whole group's build).
    groups:
      crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "gpui-kit"
      - dependency-name: "gpui-kit-*"
      - dependency-name: "gpui-pre*"
      - dependency-name: "gpui-fast*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
