# A release: pushing the tag v<version> builds every package in release
# mode with the same scripts CI tests them with, and publishes them as one
# GitHub release whose text is CHANGELOG.md's section for that version
# (scripts/release-notes.sh, which also refuses a tag that disagrees with
# the version in Cargo.toml, the Nix package or the PKGBUILD). Only a
# commit that passed CI on main is released. The macOS cask in
# dorhawk-software/homebrew-tap follows (HOMEBREW_TAP_DEPLOY_KEY), and
# dorhawk-software/packages is asked to put the .deb and RPM into
# packages.dorhawk.software.
# Started by hand (a rehearsal), it builds and tests every package of the
# version in Cargo.toml and publishes nothing: for changes to this file,
# which would otherwise first run at a real release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release runs to its end; another tag waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: The changelog's section, every version matching the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_EVENT_NAME" = push ] || version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          scripts/release-notes.sh "$version" > notes.md
      - name: The tagged commit passed CI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "CI hasn't passed for $GITHUB_SHA: push it to main, let CI pass, then tag." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  linux:
    needs: notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: This week (CI's package cache is kept per week)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ~/crake-cache
          key: packages-${{ steps.week.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            packages-${{ steps.week.outputs.week }}-
            packages-
      - name: The .deb (built on Ubuntu 22.04) and the RPM from the same files
        run: CRAKE_CACHE=$HOME/crake-cache scripts/build-deb.sh && scripts/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/deb/*.deb
            target/rpm/*.rpm

  windows-exe:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: crake.exe, craked.exe and crake-hook.exe
        run: cargo build --release --locked -p crake -p craked
      - name: No Visual C++ runtime needed (a fresh Windows has none)
        shell: pwsh
        run: |
          foreach ($f in 'crake', 'craked', 'crake-hook') {
            if (Select-String -Path "target/release/$f.exe" -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
              throw "$f.exe needs VCRUNTIME140.dll"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            target/release/crake.exe
            target/release/craked.exe
            target/release/crake-hook.exe

  windows:
    needs: windows-exe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: target/windows/app
      - name: The installer, with openconnect and Wintun (unsigned)
        run: scripts/build-openconnect-windows.sh && scripts/build-windows-installer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/windows/crake-setup-*.exe

  # Windows on ARM64: its own programs, openconnect built in MSYS2 there,
  # OpenVPN's ARM64 MSI, its own installer, installed and removed on an
  # ARM64 runner before it's published (CLAUDE.md, Windows on ARM64).
  windows-arm64-exe:
    needs: notes
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: crake.exe, craked.exe and crake-hook.exe for ARM64
        run: cargo build --release --locked -p crake -p craked
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-exe
          path: |
            target/release/crake.exe
            target/release/craked.exe
            target/release/crake-hook.exe

  windows-arm64-openconnect:
    needs: notes
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: make curl unzip tar diffutils
          pacboy: clang:p llvm:p gnutls:p libxml2:p zlib:p pkgconf:p
      - name: openconnect for ARM64
        shell: msys2 {0}
        run: sh scripts/build-openconnect-windows-arm64.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-openconnect
          path: target/windows-arm64/openconnect

  windows-arm64-setup:
    needs: [windows-arm64-exe, windows-arm64-openconnect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-exe
          path: target/windows-arm64/app
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-openconnect
          path: target/windows-arm64/openconnect
      - name: The ARM64 installer, with openconnect and OpenVPN (unsigned)
        env:
          CRAKE_WINDOWS_ARCH: arm64
        run: scripts/build-windows-installer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-setup
          path: target/windows-arm64/crake-setup-*-arm64.exe

  windows-arm64:
    needs: windows-arm64-setup
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-setup
          path: setup
      - name: It installs, runs craked and uninstalls
        shell: pwsh
        run: scripts/windows-arm64-install-test.ps1 (Get-ChildItem setup/crake-setup-*-arm64.exe).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: setup/crake-setup-*-arm64.exe

  # For Apple Silicon and Intel Macs: each built in a job of its own, at
  # once (one after the other they took 22 of the job's 24 minutes,
  # uncached, 0.12.0), then joined (lipo), signed and notarized below.
  macos-build:
    needs: notes
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          key: ${{ matrix.target }}
      - name: crake, craked and the hook for ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p crake -p craked
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/crake
            target/${{ matrix.target }}/release/craked
            target/${{ matrix.target }}/release/crake-hook

  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-bin-*
          path: target/prebuilt
      - name: A keychain with the Developer ID certificates
        env:
          MACOS_APP_P12: ${{ secrets.MACOS_APP_P12 }}
          MACOS_APP_P12_PASSWORD: ${{ secrets.MACOS_APP_P12_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: echo "CRAKE_KEYCHAIN=$(sh scripts/macos-signing.sh setup)" >> "$GITHUB_ENV"
      - name: The installer package, signed
        run: CRAKE_PREBUILT=target/prebuilt sh scripts/build-macos-pkg.sh
      - name: Notarized by Apple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: sh scripts/macos-signing.sh notarize target/macos/Crake-*.pkg
      - name: It installs, runs craked, upgrades and uninstalls
        env:
          GH_TOKEN: ${{ github.token }}
        # Over the newest release (craked was its own launchd daemon up to
        # 0.6): installing stops it and takes its files away.
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p 'Crake-*.pkg' -D "$RUNNER_TEMP/previous"
          CRAKE_PREVIOUS_PKG=$(ls "$RUNNER_TEMP"/previous/Crake-*.pkg) sh scripts/macos-pkg-test.sh target/macos/Crake-*.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/macos/Crake-*.pkg

  publish:
    needs: [linux, windows, windows-arm64, macos]
    # A rehearsal stops here (and so the cask, the repository and the AUR).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      # Each artifact in a folder of its own (the Linux one with deb/ and
      # rpm/ inside): the release gets the files side by side, without the
      # loose .exe files the Windows installer is made of.
      - name: Checksums
        run: |
          mkdir release
          find dist -type f ! -path 'dist/windows-exe/*' ! -path 'dist/windows-arm64-*/*' ! -path 'dist/notes/*' ! -path 'dist/macos-bin-*/*' -exec cp {} release/ \;
          cp dist/notes/notes.md notes.md
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Crake ${GITHUB_REF_NAME#v}" --notes-file notes.md
      # The run's page lists the jobs' hand-offs (its artifacts, gone at the
      # end): it says where the downloads are.
      - name: Where to download it
        run: |
          V=${GITHUB_REF_NAME#v}
          {
            echo "## Crake $V is out"
            echo
            echo "Download it from [the release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME), not from this run."
            echo
            scripts/release-notes.sh --which "$V"
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - name: The cask in dorhawk-software/homebrew-tap, at this version
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          V=${GITHUB_REF_NAME#v}
          SHA=$(sha256sum "dist/Crake-$V.pkg" | cut -d' ' -f1)
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:dorhawk-software/homebrew-tap.git tap
          sed -e "s/@VERSION@/$V/" -e "s/@SHA256@/$SHA/" packaging/macos/crake.rb.in > tap/Casks/crake.rb
          cd tap
          git config user.name "Crake release"
          git config user.email ondrej@dorhawk.software
          git add Casks/crake.rb
          git commit -q -m "crake $V"
          git push -q origin HEAD

  packages:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      # dorhawk-software/packages publishes the .deb and RPM into
      # packages.dorhawk.software (it signs them; the key is its own). Asked
      # here when this repository has the token for it; otherwise its
      # hourly run finds the release within the hour.
      - name: Ask packages.dorhawk.software to publish this release
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No PACKAGES_DISPATCH_TOKEN: dorhawk-software/packages picks the release up within the hour."
            exit 0
          fi
          gh api repos/dorhawk-software/packages/dispatches -f event_type=release \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$GITHUB_REF_NAME"

  aur:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The AUR builds from the tag's source tarball (packaging/arch). Skipped
      # until the AUR account's key is a secret here (registration there
      # was closed when this was written).
      - name: Into the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "No AUR_SSH_KEY: the AUR isn't updated."
            exit 0
          fi
          scripts/aur-publish.sh "${GITHUB_REF_NAME#v}"

  # The jobs hand each other a dozen artifacts (programs, openconnect, the
  # installers before and after their tests): all of it is on the release
  # now, and the run's page listed them as if they were downloads. Gone
  # once the release and the cask are out; kept when anything failed (for
  # a re-run) and after a rehearsal (to look at).
  tidy:
    needs: [publish, homebrew]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: The run's artifacts deleted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
