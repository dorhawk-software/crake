# packages.dorhawk.software published again from a release's .deb and RPM
# (started by hand: Actions → Repository → Run workflow), as release.yml's
# repository job does: after a change to the indexes or the start page,
# without a new release. Earlier versions in the bucket stay.
name: Repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose packages to publish (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The release's .deb and RPM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download ${TAG:+"$TAG"} --pattern '*.deb' --pattern '*.rpm' --dir dist
      - name: Into packages.dorhawk.software (apt and dnf), signed
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: scripts/publish-repo.sh dist
      - name: apt and dnf install it from there
        run: scripts/repo-test.sh --live https://packages.dorhawk.software
