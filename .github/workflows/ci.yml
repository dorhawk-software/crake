# Every push and pull request: the lint gate, the tests and the coverage
# floors; Crake for Windows (scripts/windows-check.sh, then built and its
# portable tests run on a Windows runner) and for macOS; the tests that
# need real networking, each in throwaway containers with no network
# (scripts/netns-test.sh, scripts/e2e-test.sh); and the packages, built once
# and installed and used on every supported release, in parallel, with the
# journey on each.
name: CI

on:
  push:
    # Dependabot's branches are tested as pull requests: not twice.
    branches-ignore: ["dependabot/**"]
  pull_request:
  # The weekly GPUI update starts CI on its branch (gpui.yml).
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a new push cancels the one still going (only the
# newest commit matters; CI minutes aren't free for anyone). Caches are
# saved by main's runs only and restored everywhere: GitHub keeps 10 GB
# per repository, and copies per branch pushed out the ones jobs needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line numbers are all CI needs from debug info; full debug info is most
  # of a target directory, so most of each cache (release builds keep
  # their own profile).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # What GPUI links (X11, keyboard, fonts) and what the tests drive.
  APT: >-
    build-essential pkg-config cmake clang
    libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev
    openconnect nftables iproute2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-llvm-cov
      - name: Lint gate
        run: scripts/lint.sh
      # Every test, measured (and failing when one does), then in the very
      # same build the namespace and e2e tests (nftables, policy routing, a
      # real ocserv; containers without a network). They had a job of their
      # own, which spent ~11 of its 15 minutes building what this one had
      # just built (a -p build unifies dependencies' features differently).
      # The X11 test: a real GPUI window on Xvfb, following a scale change.
      - name: Tests, the coverage floors, the namespace, e2e and X11 tests
        run: scripts/check-coverage.sh scripts/netns-test.sh scripts/e2e-test.sh scripts/x11-test.sh

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Crake compiles for Windows, lint-clean
        run: scripts/windows-check.sh

  # macOS (CLAUDE.md): Crake compiles there, lint-clean, the portable tests
  # pass, and craked's macOS parts work as root on a utun device of the
  # test's own (crates/craked/tests/macos.rs). Only on GitHub's runners:
  # no Mac here.
  macos:
    runs-on: macos-latest
    env:
      # Whether this run may sign (a fork's or Dependabot's has no
      # secrets): only that, the secrets themselves go to the steps that
      # need them, never to the builds (crates' build scripts run there).
      SIGNING: ${{ secrets.MACOS_APP_P12 != '' }}
      # For Intel Macs too (both builds, joined), in runs started by hand:
      # a release builds universal, and this tries it first.
      CRAKE_UNIVERSAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Crake compiles for macOS, lint-clean
        run: cargo clippy --workspace --all-targets --locked
      - name: The tests that aren't Linux's own, on macOS
        run: cargo test --workspace --locked
      - name: craked's macOS parts on a real utun device, as root
        run: |
          BIN=$(cargo test -p craked --test macos --no-run --locked --message-format=json |
            jq -r 'select(.executable != null and .target.name == "macos") | .executable')
          sudo CRAKE_MACOS_ROOT=1 "$BIN" --nocapture
      - name: A keychain with the Developer ID certificates
        if: env.SIGNING == 'true'
        env:
          MACOS_APP_P12: ${{ secrets.MACOS_APP_P12 }}
          MACOS_APP_P12_PASSWORD: ${{ secrets.MACOS_APP_P12_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: echo "CRAKE_KEYCHAIN=$(sh scripts/macos-signing.sh setup)" >> "$GITHUB_ENV"
      # Of the development build the tests used: a release build compiled
      # everything again, optimised (9 min, and a bigger cache). Signed
      # with the Developer ID when the keychain is there.
      - name: The installer package (development build)
        run: CRAKE_PROFILE=dev sh scripts/build-macos-pkg.sh
      # Apple's notary service takes minutes: for runs started by hand only
      # (releases are notarized by release.yml).
      - name: Notarized by Apple
        if: env.SIGNING == 'true' && github.event_name == 'workflow_dispatch'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: sh scripts/macos-signing.sh notarize target/macos/Crake-*.pkg
      # The front-window check against the release before its fix (0.3.0),
      # where Settings must open behind: proof the check tells the two
      # apart. Runs started by hand only.
      - name: Before the fix (0.3.0), Settings opens behind
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 -R "$GITHUB_REPOSITORY" -p 'Crake-*.pkg' -D "$RUNNER_TEMP/old"
          sudo installer -pkg "$RUNNER_TEMP"/old/Crake-*.pkg -target /
          sh scripts/macos-front-test.sh --expect-behind
          sudo /usr/local/libexec/crake/uninstall
      - name: It installs, runs craked, upgrades and uninstalls
        env:
          GH_TOKEN: ${{ github.token }}
        # Over the newest release (craked was its own launchd daemon up to
        # 0.6): installing stops it and takes its files away.
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p 'Crake-*.pkg' -D "$RUNNER_TEMP/previous"
          CRAKE_PREVIOUS_PKG=$(ls "$RUNNER_TEMP"/previous/Crake-*.pkg) sh scripts/macos-pkg-test.sh target/macos/Crake-*.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: crake-macos
          path: target/macos/Crake-*.pkg

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The tests that aren't Linux's own, on Windows
        run: cargo test --workspace --locked
      - name: crake.exe, craked.exe and crake-hook.exe (unsigned)
        run: cargo build --release --locked -p crake -p craked
      - name: No Visual C++ runtime needed (a fresh Windows has none)
        shell: pwsh
        run: |
          foreach ($f in 'crake', 'craked', 'crake-hook') {
            if (Select-String -Path "target/release/$f.exe" -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
              throw "$f.exe needs VCRUNTIME140.dll"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: crake-windows
          path: |
            target/release/crake.exe
            target/release/craked.exe
            target/release/crake-hook.exe

  nixos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Let the test's VMs use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Nix's sandbox: every build in /build, which the dependency layers
      # need (packaging/nix/package.nix: cargo reuses the base's builds only
      # from the same folder; without a sandbox each build gets a new one).
      # Builds run as the runner's user, in user namespaces, which Ubuntu
      # 24.04's AppArmor keeps from unprivileged users unless told.
      - name: Let Nix build in its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            system-features = kvm nixos-test benchmark big-parallel
            sandbox = true
      # The Nix store, in Cachix (free for open source), not GitHub's 10 GB
      # cache: Crake's crates.io dependencies are a derivation of their own
      # (crane), rebuilt only when Cargo.lock changes. Every path built here
      # is pushed; later runs substitute from Cachix. A run without the token
      # (a fork's) still pulls from the public cache, just pushes nothing.
      - uses: cachix/cachix-action@v17
        with:
          name: crake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only what the next run can reuse: the crates.io dependencies
          # (crane's crake-deps, crake-journey-deps, and the base layer
          # under them, crake-base-deps and crake-journey-base-deps). Crake itself, the
          # journey binary, the filtered source and the VM test's machines
          # change with every commit; pushed, they only filled the free
          # 5 GB (Cachix then evicts the least used, the deps included).
          pushFilter: '(-source$|-crake-[0-9]|-crake-journey-[0-9]|vm-test-run-|nixos-system-|nixos-vm|-nixos\.qcow2|-etc$|-system-path$|-closure-info$)'
      # A release bumps the version: the dependency builds mustn't change
      # with it, or every release rebuilds them (~45 min).
      - name: The dependency builds don't depend on Crake's version
        run: scripts/nix-deps-check.sh
      - name: Build Crake with Nix
        run: nix build --print-build-logs .#default
      - name: The NixOS module, end to end (a gateway and a client VM)
        run: nix build --print-build-logs .#checks.x86_64-linux.vm

  # The packages, built once (with the journey's test binary), then each
  # system tested in a job of its own, all at once.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: This week (the cache starts afresh each week, with its Rust)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # And the stable Rust the .deb's container builds with: a build by
      # another compiler can't be reused, and a key that already exists is
      # never saved again (2026-10-16: Rust 1.99.1 came mid-week, the cache
      # held 1.99.0's build, and every .deb built from scratch, 17 min).
      # Dots become dashes so prune-caches.sh still sees one kind.
      - name: Stable Rust's version
        id: rust
        run: |
          v=$(curl -sf https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | sed -n '/^\[pkg.rust\]/{n;s/^version = "\([0-9.]*\) .*/\1/p;}')
          echo "rust=$(echo "${v:-0}" | tr . -)" >> "$GITHUB_OUTPUT"
      # rustup, Cargo's downloads and both builds (the .deb's on 22.04 and
      # Arch's with Arch's Rust), as the Windows and check jobs keep theirs.
      - uses: actions/cache/restore@v6
        with:
          path: ~/crake-cache
          key: packages-${{ steps.week.outputs.week }}-${{ steps.rust.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            packages-${{ steps.week.outputs.week }}-${{ steps.rust.outputs.rust }}-
            packages-${{ steps.week.outputs.week }}-
            packages-
      - name: Build the .deb on Ubuntu 22.04 with the journey, and the RPM from the same files
        run: CRAKE_CACHE=$HOME/crake-cache scripts/build-deb.sh && scripts/build-rpm.sh
      - name: Build the Arch package from source with Arch's Rust
        run: CRAKE_CACHE=$HOME/crake-cache scripts/build-arch.sh
      # The containers write as root, and Cargo unpacks some crates' files
      # readable by their owner only: the cache has to be readable to be saved.
      - name: Let the cache be saved
        if: github.ref == 'refs/heads/main'
        run: sudo chmod -R a+rX ~/crake-cache
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/crake-cache
          key: packages-${{ steps.week.outputs.week }}-${{ steps.rust.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/upload-artifact@v7
        with:
          name: crake-packages
          path: |
            target/deb/*.deb
            target/deb/journey
            target/rpm/*.rpm
            target/arch/crake-[0-9]*.pkg.tar.zst

  package-test:
    needs: packages
    runs-on: ubuntu-24.04
    name: package-test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        system: ["22.04", "24.04", "26.04", "debian:12", "debian:13", "fedora:43", "fedora:44", "fedora:45", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: crake-packages
          path: target
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/deb/journey
      - name: Install it, a tunnel through the service, the journey, an upgrade, removal
        run: scripts/deb-test.sh ${{ matrix.system }}

  # Once main's jobs have saved their caches: the ones a newer cache of the
  # same kind replaced (an older Cargo.lock's) are deleted, or they push
  # out caches still in use (scripts/prune-caches.sh).
  caches:
    needs: [check, windows, macos, windows-build, packages]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete the caches newer ones replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-caches.sh
