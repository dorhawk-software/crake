# Every push and pull request: the lint gate, the tests and the coverage
# floors; Crake for Windows (scripts/windows-check.sh, then built and its
# portable tests run on a Windows runner) and for macOS; the tests that
# need real networking, each in throwaway containers with no network
# (scripts/netns-test.sh, scripts/e2e-test.sh); and the packages, built once
# and installed and used on every supported release, in parallel, with the
# journey on each.
name: CI

on:
  push:
    # Dependabot's branches are tested as pull requests: not twice.
    branches-ignore: ["dependabot/**"]
  pull_request:
  # The weekly GPUI update starts CI on its branch (gpui.yml).
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a new push cancels the one still going (only the
# newest commit matters; CI minutes aren't free for anyone). Caches are
# saved by main's runs only and restored everywhere: GitHub keeps 10 GB
# per repository, and copies per branch pushed out the ones jobs needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line numbers are all CI needs from debug info; full debug info is most
  # of a target directory, so most of each cache (release builds keep
  # their own profile).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # What GPUI links (X11, keyboard, fonts) and what the tests drive.
  APT: >-
    build-essential pkg-config cmake clang
    libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev
    openconnect nftables iproute2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-llvm-cov
      - name: Lint gate
        run: scripts/lint.sh
      # cargo llvm-cov runs every test (and fails when one does): the tests
      # and their coverage in one build.
      - name: Tests, and the coverage floors
        run: scripts/check-coverage.sh

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Crake compiles for Windows, lint-clean
        run: scripts/windows-check.sh

  # macOS (CLAUDE.md): Crake compiles there, lint-clean, the portable tests
  # pass, and craked's macOS parts work as root on a utun device of the
  # test's own (crates/craked/tests/macos.rs). Only on GitHub's runners:
  # no Mac here.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Crake compiles for macOS, lint-clean
        run: cargo clippy --workspace --all-targets --locked
      - name: The tests that aren't Linux's own, on macOS
        run: cargo test --workspace --locked
      - name: craked's macOS parts on a real utun device, as root
        run: |
          BIN=$(cargo test -p craked --test macos --no-run --locked --message-format=json |
            jq -r 'select(.executable != null and .target.name == "macos") | .executable')
          sudo CRAKE_MACOS_ROOT=1 "$BIN" --nocapture

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The tests that aren't Linux's own, on Windows
        run: cargo test --workspace --locked
      - name: crake.exe, craked.exe and crake-hook.exe (unsigned)
        run: cargo build --release --locked -p crake -p craked
      - name: No Visual C++ runtime needed (a fresh Windows has none)
        shell: pwsh
        run: |
          foreach ($f in 'crake', 'craked', 'crake-hook') {
            if (Select-String -Path "target/release/$f.exe" -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
              throw "$f.exe needs VCRUNTIME140.dll"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: crake-windows
          path: |
            target/release/crake.exe
            target/release/craked.exe
            target/release/crake-hook.exe

  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Never saved: 10 GB per repository fits Nix, the packages, check,
          # the Windows build and macOS, not this too (it evicted Nix's).
          # Uncached it takes about as long as the packages do cached.
          save-if: false
      - name: nftables and policy routing in a namespace
        run: scripts/netns-test.sh
      - name: End to end against ocserv
        run: scripts/e2e-test.sh

  nixos:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # cache-nix-action removes its old caches.
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Let the test's VMs use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            system-features = kvm nixos-test benchmark big-parallel
      # The Nix store between runs: Crake's crates.io dependencies are a
      # derivation of their own (crane), rebuilt only when Cargo.lock changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P2D
          purge-primary-key: never
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Crake with Nix
        run: nix build --print-build-logs .#default
      - name: The NixOS module, end to end (a gateway and a client VM)
        run: nix build --print-build-logs .#checks.x86_64-linux.vm

  # The packages, built once (with the journey's test binary), then each
  # system tested in a job of its own, all at once.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: This week (the cache starts afresh each week, with its Rust)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # rustup, Cargo's downloads and both builds (the .deb's on 22.04 and
      # Arch's with Arch's Rust), as the Windows and check jobs keep theirs.
      - uses: actions/cache/restore@v4
        with:
          path: ~/crake-cache
          key: packages-${{ steps.week.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            packages-${{ steps.week.outputs.week }}-
            packages-
      - name: Build the .deb on Ubuntu 22.04 with the journey, and the RPM from the same files
        run: CRAKE_CACHE=$HOME/crake-cache scripts/build-deb.sh && scripts/build-rpm.sh
      - name: Build the Arch package from source with Arch's Rust
        run: CRAKE_CACHE=$HOME/crake-cache scripts/build-arch.sh
      # The containers write as root, and Cargo unpacks some crates' files
      # readable by their owner only: the cache has to be readable to be saved.
      - name: Let the cache be saved
        if: github.ref == 'refs/heads/main'
        run: sudo chmod -R a+rX ~/crake-cache
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/crake-cache
          key: packages-${{ steps.week.outputs.week }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        with:
          name: crake-packages
          path: |
            target/deb/*.deb
            target/deb/journey
            target/rpm/*.rpm
            target/arch/crake-[0-9]*.pkg.tar.zst

  package-test:
    needs: packages
    runs-on: ubuntu-24.04
    name: package-test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        system: ["22.04", "24.04", "26.04", "debian:12", "debian:13", "fedora:43", "fedora:44", "fedora:45", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: crake-packages
          path: target
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/deb/journey
      - name: Install it, a tunnel through the service, the journey, an upgrade, removal
        run: scripts/deb-test.sh ${{ matrix.system }}
