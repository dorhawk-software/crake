# Every push and pull request: the lint gate, the tests and the coverage
# floors; Crake for Windows (scripts/windows-check.sh, then built and its
# portable tests run on a Windows runner); the tests that
# need real networking, each in throwaway containers with no network
# (scripts/netns-test.sh, scripts/e2e-test.sh); and the .deb and RPM, built
# once and installed and used on every supported release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # What GPUI links (X11, keyboard, fonts) and what the tests drive.
  APT: >-
    build-essential pkg-config cmake clang
    libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev
    openconnect nftables iproute2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-llvm-cov
      - name: Lint gate
        run: scripts/lint.sh
      - name: Tests
        run: cargo test --workspace
      - name: Coverage floors
        run: scripts/check-coverage.sh

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Crake compiles for Windows, lint-clean
        run: scripts/windows-check.sh

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tests that aren't Linux's own, on Windows
        run: cargo test --workspace --locked
      - name: crake.exe, craked.exe and crake-hook.exe (unsigned)
        run: cargo build --release --locked -p crake -p craked
      - name: No Visual C++ runtime needed (a fresh Windows has none)
        shell: pwsh
        run: |
          foreach ($f in 'crake', 'craked', 'crake-hook') {
            if (Select-String -Path "target/release/$f.exe" -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
              throw "$f.exe needs VCRUNTIME140.dll"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: crake-windows
          path: |
            target/release/crake.exe
            target/release/craked.exe
            target/release/crake-hook.exe

  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: nftables and policy routing in a namespace
        run: scripts/netns-test.sh
      - name: End to end against ocserv
        run: scripts/e2e-test.sh

  nixos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Let the test's VMs use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = kvm nixos-test benchmark big-parallel
      - name: Build Crake with Nix
        run: nix build --print-build-logs .#default
      - name: The NixOS module, end to end (a gateway and a client VM)
        run: nix build --print-build-logs .#checks.x86_64-linux.vm

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the .deb on Ubuntu 22.04, and the RPM from the same files
        run: scripts/build-deb.sh && scripts/build-rpm.sh
      - name: Build the Arch package from source with Arch's Rust
        run: scripts/build-arch.sh
      - name: Install and use them on Ubuntu, Debian, Fedora and Arch
        run: scripts/deb-test.sh 22.04 24.04 26.04 debian:12 debian:13 fedora:43 fedora:44 fedora:45 archlinux:latest
      - uses: actions/upload-artifact@v4
        with:
          name: crake-packages
          path: |
            target/deb/*.deb
            target/rpm/*.rpm
            target/arch/crake-[0-9]*.pkg.tar.zst
